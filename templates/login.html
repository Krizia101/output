{% extends "base.html" %}

{% block layout %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-bg-main); padding: 20px;">
    
    <div class="card" style="width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(59, 109, 17, 0.1);">
        
        <div class="leaf-logo" style="width: 54px; height: 54px; background: var(--leaf); margin: 0 auto 15px; font-size: 24px; color: white;">🌿</div>
        
        <h2 style="font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 5px;">Pestong Yummy PH</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 25px;">Sign in to your account</p>
        
        <form action="/login" method="POST" style="text-align: left;">
            
            {% if error %}
            <div style="background-color: #FCEBEB; color: #A32D2D; padding: 10px; border-radius: var(--radius-md); margin-bottom: 15px; font-size: 12px; font-weight: 600; border: 1px solid #F09595; text-align: center;">
                {{ error }}
            </div>
            {% endif %}

            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 5px;">Username</label>
                <input type="text" name="username" placeholder="e.g. admin" required style="width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: var(--radius-md); font-size: 14px; outline-color: var(--leaf);">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 5px;">Password</label>
                <input type="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: var(--radius-md); font-size: 14px; outline-color: var(--leaf);">
            </div>
            
            <button type="submit" class="btn-leaf" style="padding: 12px; font-size: 14px; margin-top: 5px;">Sign In</button>
        </form>
    </div>
    
</div>
{% endblock %}
