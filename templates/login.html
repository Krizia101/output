<!-- This tells Jinja2 to use the CSS from base.html -->
{% extends "base.html" %}

<!-- We are overriding the entire 'layout' block because the login page doesn't need the top navigation bar -->
{% block layout %}
<div class="login-wrap">
    <div class="login-card">
        <div class="leaf-logo" style="width:44px; height:44px; background:var(--leaf); margin:0 auto 12px; font-size:20px;">🌿</div>
        <div style="font-size:15px; font-weight:500; margin-bottom:3px;">Pestong Yummy PH</div>
        <div style="font-size:12px; color:var(--color-text-secondary); margin-bottom:18px;">Sign in to your account</div>
        
<!-- We use method="POST" for secure data transmission -->
        <form action="/login" method="POST">
            
            <!-- This section displays an error message if the login fails -->
            {% if error %}
            <div style="background-color: #FCEBEB; color: #A32D2D; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; border: 1px solid #F09595;">
                {{ error }}
            </div>
            {% endif %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <!-- Added name="username" so Python can read it -->
                <input type="text" name="username" placeholder="e.g. admin" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <!-- Added name="password" so Python can read it -->
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-leaf" style="margin-top: 10px;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
